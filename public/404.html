<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Al Falah Lazuardi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Manrope', system-ui, sans-serif;
      color: #ecebf3;
      background: radial-gradient(ellipse at 60% 30%, #2a1f6b 0%, #120d2e 40%, #07070b 75%);
      text-align: center;
    }
    h1 {
      font-family: 'Syne', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(96px, 22vw, 260px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      background: linear-gradient(100deg, #a594ff, #ff8a6b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 18px auto 32px; max-width: 36ch; color: #8d8b9c; font-size: 17px; }
    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 99px;
      border: 1px solid rgba(236, 235, 243, 0.2);
      color: #ecebf3;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s, border-color 0.3s;
    }
    a:hover { background: rgba(255, 255, 255, 0.06); border-color: #ecebf3; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This endpoint returned nothing. Even fast backends can't serve pages that don't exist.</p>
    <a href="/">← Back to the homepage</a>
  </main>
</body>
</html>
